name: Deploy to Kubernetes

on:
  workflow_run:
    workflows: ["Build Prediction Docker Image"]
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0

        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}

          script: |
            sudo kubectl set image deployment/prediction-service \
              prediction-service=barthaanna2002/worldcup-prediction-service:latest \
              -n worldcup

            sudo kubectl rollout status deployment/prediction-service -n worldcup